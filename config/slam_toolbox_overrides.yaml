slam_toolbox:
  ros__parameters:
    # Use muxed/resampled scan stream; raw /scan/livox can be too sparse (~0.8 Hz).
    scan_topic: /scan
    # Publish map->odom at 100 Hz to reduce TF edge-race extrapolation errors.
    transform_publish_period: 0.01

/slam_toolbox:
  ros__parameters:
    scan_topic: /scan
    transform_publish_period: 0.01

sync_slam_toolbox_node:
  ros__parameters:
    scan_topic: /scan
    transform_publish_period: 0.01

/sync_slam_toolbox_node:
  ros__parameters:
    scan_topic: /scan
    transform_publish_period: 0.01
