/**:
  ros__parameters:
    cmd_vel_in: /cmd_vel
    cmd_vel_out: /unitree/cmd_vel
    odom_topic: /odom
    imu_topic: /imu
    joint_states_topic: /joint_states

    livox_points_topic: /livox/points
    d435_color_topic: /intel/D435i/color
    d435_depth_topic: /intel/D435i/depth
    d435_camera_info_topic: /intel/D435i/camera_info

    rgb_topic: /intel/D435i/color
    depth_topic: /intel/D435i/depth
    yolo_output_topic: /yolo_output/image
    map_topic: /map
    lowres_map_topic: /lowres_map

    base_frame: base_link
    odom_frame: odom
    map_frame: map
    camera_frame: d435i_depth_cam_optical

    scan_primary_topic: /scan/livox
    scan_secondary_topic: /scan/depth
    scan_output_topic: /scan
    scan_output_frame: base_link
    restamp_scan: true
    restamp_backdate_sec: 0.05
    scan_publish_new_only: false
    
    # Sensor cadence in this stack:
    # - Livox scan updates ~every 5s (primary)
    # - D435 depth scan updates ~every 2s (secondary)
    primary_stale_timeout_sec: 6.5
    secondary_stale_timeout_sec: 3.0
    primary_reacquire_delay_sec: 2.0
    max_input_msg_age_sec: 8.0
    max_future_offset_sec: 0.25
    scan_publish_rate_hz: 8.0

    max_navigation_retries: 3
    navigation_retry_delay_sec: 0.5
    navigation_timeout_sec: 30.0

    pointcloud_target_frame: base_link
    pointcloud_transform_tolerance_sec: 0.5
